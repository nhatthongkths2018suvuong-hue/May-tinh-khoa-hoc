plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.khoahoc.maytinh'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.khoahoc.maytinh'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Thu nhỏ code + tài nguyên để APK nhẹ nhất có thể
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ký bằng khóa debug để cài được ngay (không cần keystore riêng)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
